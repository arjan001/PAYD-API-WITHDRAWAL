# ─────────────────────────────────────────────────────────────────────────────
# Netlify configuration for Payd Dashboard
#
# Architecture:
#   • The React/Vite dashboard is built as a static site, served by CDN.
#   • The Express API runs as a Netlify Function (netlify/functions/api.mts).
#     All /api/* requests are proxied there automatically.
#   • PostgreSQL must be an external managed database (Supabase, Neon, etc.)
#     — set DATABASE_URL in Netlify → Site → Environment Variables.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # Netlify auto-detects pnpm from pnpm-lock.yaml, but we include the install
  # step explicitly so workspace symlinks are always wired up correctly.
  command = "pnpm install --frozen-lockfile && PORT=3000 BASE_PATH=/ pnpm --filter @workspace/dashboard run build"
  publish  = "artifacts/dashboard/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  NODE_ENV     = "production"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# ── Routing ───────────────────────────────────────────────────────────────────

# All /api/* calls → Netlify Function (Express server).
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# SPA fallback — React Router handles all other client-side routes.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
